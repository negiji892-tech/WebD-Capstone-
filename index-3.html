<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Foodie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


<header class="navbar">
    <div class="logo">Foodie</div>

    <nav class="nav-links">
        <a href="#">Categories</a>
        <a href="#">Restaurants</a>
        <a href="#">Offers</a>
        <a href="#">Testimonials</a>
        <a href="#">App</a>
    </nav>

    <div class="nav-buttons">
        <button class="login-btn">Login</button>
        <button class="signup-btn">Sign Up</button>
    </div>
</header>


<section class="hero">
    <div class="hero-left">
        <h1>Delicious food,<br>delivered to you</h1>

        <p>
            Order from your favorite restaurants and get your meal delivered fast,
            fresh, and hot. Discover the best food in your city with Foodie!
        </p>

        <button class="order-btn">Order Now</button>

        
        <div class="search-box">
            <input type="text" placeholder="Enter your location">

            <select>
                <option>All Categories</option>
                <option>Pizza</option>
                <option>Burger</option>
                <option>Indian</option>
                <option>Chinese</option>
            </select>

            <button class="search-btn">Search</button>
        </div>
    </div>

    <div class="hero-right">
        <img src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe" alt="Food Image">
    </div>
</section>

</body>
</html>
